[project]
name = "nota"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "funasr>=1.4.20",
    "httpx>=0.28.1",
    "modelscope>=1.40.2",
    "numpy>=2.5.4",
    "psycopg[binary,pool]>=3.3.7",
    "silero-vad>=6.2.3",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
